<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derssel Şeyler - Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        font-family: "Nunito Sans", "Segoe UI", Arial, sans-serif;
        color: #fff;
        background: #df477b;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        isolation: isolate;
    }

    /* Çok hafif lava-lamp hareketi */
    body::before,
    body::after {
        content: "";
        position: absolute;
        inset: -18%;
        z-index: -1;
        pointer-events: none;
        filter: blur(48px);
        will-change: transform;
    }

    body::before {
        background:
            radial-gradient(ellipse at 18% 78%, rgba(166, 0, 255, .98) 0%, rgba(166, 0, 255, .55) 18%, transparent 43%),
            radial-gradient(ellipse at 82% 20%, rgba(242, 100, 77, .95) 0%, rgba(242, 100, 77, .55) 21%, transparent 46%),
            radial-gradient(ellipse at 48% 45%, rgba(218, 52, 133, .82) 0%, transparent 40%);
        animation: lavaMove 18s ease-in-out infinite alternate;
    }

    body::after {
        background:
            radial-gradient(ellipse at 72% 72%, rgba(255, 93, 70, .62) 0%, transparent 37%),
            radial-gradient(ellipse at 28% 28%, rgba(203, 35, 165, .62) 0%, transparent 39%),
            radial-gradient(ellipse at 55% 95%, rgba(147, 0, 255, .48) 0%, transparent 33%);
        animation: lavaMove2 23s ease-in-out infinite alternate;
        opacity: .9;
    }

    @keyframes lavaMove {
        0%   { transform: translate3d(-2%, 1%, 0) scale(1); }
        50%  { transform: translate3d(2%, -2%, 0) scale(1.035); }
        100% { transform: translate3d(-1%, 2%, 0) scale(1.02); }
    }

    @keyframes lavaMove2 {
        0%   { transform: translate3d(2%, -1%, 0) scale(1.02); }
        50%  { transform: translate3d(-2%, 2%, 0) scale(1.045); }
        100% { transform: translate3d(1%, -2%, 0) scale(1.025); }
    }

    @media (prefers-reduced-motion: reduce) {
        body::before,
        body::after {
            animation: none;
        }
    }

    .timer-wrap {
        width: min(1000px, 94vw);
        text-align: center;
        transform: translateY(-5px);
    }

    .title {
        font-size: clamp(30px, 4vw, 45px);
        font-weight: 700;
        margin-bottom: 14px;
        letter-spacing: 0.2px;
    }

    .time {
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(100px, 15vw, 175px);
        line-height: .85;
        font-weight: 700;
        letter-spacing: -3px;
        font-variant-numeric: tabular-nums;
        margin-bottom: 24px;
    }

    .current {
        font-size: clamp(30px, 4vw, 42px);
        font-weight: 700;
        margin-bottom: 30px;
        letter-spacing: 0.2px;
    }

    .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
    }

    button {
        border: 0;
        color: #fff;
        background: transparent;
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .start {
        min-width: 163px;
        height: 59px;
        padding: 0 35px;
        border-radius: 18px;
        background: #7130ff;
        font-size: 27px;
        font-weight: 700;
    }

    .lap {
        min-width: 101px;
        height: 59px;
        padding: 0 25px;
        border-radius: 19px;
        border: 2px solid rgba(255,255,255,.95);
        font-size: 27px;
        font-weight: 700;
    }

    .icon-btn {
        width: 50px;
        height: 59px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .reset-icon {
        width: 38px;
        height: 38px;
    }

    .fullscreen-icon {
        width: 38px;
        height: 38px;
    }


    @media (max-width: 600px) {
        .timer-wrap {
            width: 96vw;
        }

        .title {
            margin-bottom: 18px;
        }

        .time {
            letter-spacing: -5px;
            margin-bottom: 25px;
        }

        .current {
            margin-bottom: 25px;
        }

        .controls {
            gap: 7px;
        }

        .start {
            min-width: 130px;
            height: 54px;
            padding: 0 22px;
            font-size: 23px;
        }

        .lap {
            min-width: 87px;
            height: 54px;
            padding: 0 18px;
            font-size: 23px;
        }

        .icon-btn {
            width: 44px;
            height: 54px;
        }

        .reset-icon,
        .fullscreen-icon {
            width: 33px;
            height: 33px;
        }
    }

    .station-btn {
        position: fixed;
        top: 24px;
        right: 26px;
        z-index: 20;
        height: 46px;
        padding: 0 19px;
        border: 1px solid rgba(255,255,255,.55);
        border-radius: 14px;
        background: rgba(255,255,255,.13);
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: .1px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 8px 30px rgba(80,0,120,.12);
        transition: transform .25s ease, background .25s ease, box-shadow .25s ease;
    }

    .station-btn:hover {
        transform: translateY(-2px) scale(1.025);
        background: rgba(255,255,255,.20);
        box-shadow: 0 10px 35px rgba(80,0,120,.22);
    }

    .station-btn:active {
        transform: scale(.97);
    }


    .station-wrap {
        position: fixed;
        top: 24px;
        right: 26px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .station-wrap .station-btn {
        position: static;
    }
    .study-bubble {
        min-width: 150px;
        height: 34px;
        padding: 0 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 11px;
        background: rgba(255,255,255,.12);
        border: 1px solid rgba(255,255,255,.34);
        color: rgba(255,255,255,.92);
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    /* Geçiş efekti */
    .warp {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        opacity: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 50%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 8%, transparent 25%),
            linear-gradient(125deg, #a600ff 0%, #d82ca0 38%, #ef4774 67%, #f2644d 100%);
    }

    .warp::before,
    .warp::after {
        content: "";
        position: absolute;
        inset: -30%;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,.65);
        transform: scale(.05);
        opacity: 0;
    }

    .warp::after {
        border-width: 1px;
        filter: blur(2px);
    }

    .warp.go {
        animation: warpFlash .95s cubic-bezier(.15,.8,.2,1) forwards;
    }

    .warp.go::before {
        animation: warpRing .9s cubic-bezier(.1,.75,.15,1) forwards;
    }

    .warp.go::after {
        animation: warpRing 1.05s cubic-bezier(.1,.75,.15,1) .04s forwards;
    }

    @keyframes warpFlash {
        0% {
            opacity: 0;
            transform: scale(1);
            filter: blur(0);
        }
        12% {
            opacity: 1;
        }
        48% {
            opacity: 1;
            filter: blur(1px);
        }
        100% {
            opacity: 1;
            transform: scale(1.16);
            filter: blur(12px);
        }
    }

    @keyframes warpRing {
        0% {
            transform: scale(.05);
            opacity: .9;
        }
        100% {
            transform: scale(2.5);
            opacity: 0;
        }
    }

    body.leaving .timer-wrap,
    body.leaving .station-btn {
        animation: leaveZoom .75s cubic-bezier(.2,.8,.15,1) forwards;
    }

    @keyframes leaveZoom {
        to {
            transform: scale(1.12);
            opacity: 0;
            filter: blur(5px);
        }
    }

    @media (max-width: 600px) {
        .station-wrap {
            top: 14px;
            right: 14px;
            gap: 6px;
        }
        .station-wrap .station-btn {
            height: 40px;
            padding: 0 13px;
            font-size: 13px;
            border-radius: 12px;
        }
        .study-bubble {
            min-width: 124px;
            height: 30px;
            padding: 0 8px;
            font-size: 10px;
            border-radius: 9px;
        }
    }



    /* =========================================
       GÜNLÜK ATTACK ON TITAN KOLEKSİYONU
    ========================================= */
    .card-dock{
        position:fixed;
        right:18px;
        top:50%;
        transform:translateY(-50%);
        z-index:30;
        width:42px;
        height:58px;
        display:flex;
        align-items:center;
        justify-content:center;
        border:1px solid rgba(255,255,255,.44);
        border-radius:13px 0 0 13px;
        background:rgba(255,255,255,.10);
        box-shadow:0 10px 34px rgba(50,0,100,.16);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        transition:right .28s ease, background .28s ease, box-shadow .28s ease;
    }
    .card-dock:hover{
        right:24px;
        background:rgba(255,255,255,.16);
        box-shadow:0 12px 40px rgba(50,0,100,.22);
    }
    .card-icon{
        width:26px;
        height:34px;
        border:2px solid rgba(255,255,255,.96);
        border-radius:5px;
        position:relative;
        transform:rotate(-7deg);
        opacity:.96;
    }
    .card-icon::before{
        content:"";
        position:absolute;
        inset:4px;
        border:1px solid rgba(255,255,255,.48);
        border-radius:2px;
    }
    .card-icon::after{
        content:"";
        position:absolute;
        width:8px;
        height:8px;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        border:1px solid rgba(255,255,255,.55);
        border-radius:2px;
    }
    .card-new-dot{
        position:absolute;
        right:5px;
        top:5px;
        width:7px;
        height:7px;
        border-radius:50%;
        background:#fff;
        box-shadow:0 0 10px rgba(255,255,255,.9);
        opacity:0;
        transform:scale(.6);
        transition:opacity .2s ease, transform .2s ease;
    }
    .card-dock.has-new .card-new-dot{
        opacity:1;
        transform:scale(1);
    }
    .card-peek{
        position:absolute;
        right:34px;
        top:50%;
        width:118px;
        aspect-ratio:2/3;
        transform:translate(34px,-50%) rotate(10deg) scale(.82);
        transform-origin:right center;
        opacity:0;
        pointer-events:none;
        transition:transform .38s cubic-bezier(.2,.8,.2,1), opacity .28s ease;
        border-radius:12px;
        overflow:hidden;
        border:1px solid rgba(255,255,255,.55);
        box-shadow:0 18px 44px rgba(37,0,70,.30);
        background:#17131e;
    }
    .card-dock:hover .card-peek{
        transform:translate(0,-50%) rotate(-6deg) scale(1);
        opacity:1;
    }
    .card-peek img{
        width:100%;
        height:100%;
        object-fit:cover;
        display:block;
    }

    .card-modal{
        position:fixed;
        inset:0;
        z-index:120;
        display:none;
        align-items:center;
        justify-content:center;
        padding:22px;
        background:rgba(16,6,24,.58);
    }
    .card-modal.open{ display:flex; }
    .card-panel{
        width:min(860px, 94vw);
        max-height:90vh;
        overflow:auto;
        border-radius:24px;
        padding:22px;
        background:rgba(35,17,43,.94);
        border:1px solid rgba(255,255,255,.18);
        box-shadow:0 24px 64px rgba(0,0,0,.30);
        contain:layout paint;
    }
    .card-panel-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:14px;
        margin-bottom:18px;
    }
    .card-panel-title{
        font-size:20px;
        font-weight:800;
    }
    .card-panel-sub{
        display:none;
    }
    .card-close{
        width:38px;
        height:38px;
        border-radius:12px;
        border:1px solid rgba(255,255,255,.16);
        background:rgba(255,255,255,.08);
        font-size:24px;
        line-height:1;
    }
    .daily-stage{
        display:flex;
        align-items:center;
        justify-content:center;
        padding:8px 0 22px;
        perspective:1200px;
    }
    .collect-card{
        width:min(250px, 63vw);
        aspect-ratio:2/3;
        position:relative;
        transform-style:preserve-3d;
        transition:transform .62s cubic-bezier(.2,.72,.18,1);
        cursor:default;
        will-change:transform;
    }
    .collect-card.flipped{ transform:rotateY(180deg); }
    .collect-face{
        position:absolute;
        inset:0;
        backface-visibility:hidden;
        -webkit-backface-visibility:hidden;
        border-radius:18px;
        overflow:hidden;
        border:2px solid rgba(255,255,255,.55);
        box-shadow:0 24px 60px rgba(0,0,0,.33);
    }
    .collect-front{ transform:rotateY(180deg); background:#17131e; }
    .collect-front img{ width:100%; height:100%; object-fit:cover; display:block; }
    .collect-back{
        display:flex;
        align-items:center;
        justify-content:center;
        background:
            radial-gradient(circle at 30% 25%, rgba(255,255,255,.10), transparent 28%),
            radial-gradient(circle at 70% 75%, rgba(255,255,255,.07), transparent 30%),
            linear-gradient(145deg,#25202e,#0f0b15);
    }
    .collect-back::before{
        content:"";
        position:absolute;
        inset:16px;
        border:1px solid rgba(255,255,255,.18);
        border-radius:12px;
    }
    .collect-back-mark{
        width:72px;
        height:72px;
        border:2px solid rgba(255,255,255,.42);
        border-radius:15px;
        transform:rotate(45deg);
    }
    .card-meta{
        text-align:center;
        min-height:68px;
    }
    .card-name{
        font-size:24px;
        font-weight:800;
    }
    .card-rarity{
        margin-top:5px;
        font-size:13px;
        font-weight:800;
        letter-spacing:.08em;
        text-transform:uppercase;
    }
    .rarity-1 .card-rarity{ color:#8fd3ff; }
    .rarity-2 .card-rarity{ color:#c8a3ff; }
    .rarity-3 .card-rarity{ color:#ffe67a; text-shadow:0 0 14px rgba(255,225,90,.45); }
    .collection-section{ margin-top:20px; }
    .collection-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom:12px;
    }
    .collection-title{font-size:15px;font-weight:800;}
    .collection-count{font-size:12px;color:rgba(255,255,255,.56);}
    .collection-grid{
        display:grid;
        grid-template-columns:repeat(5,minmax(0,1fr));
        gap:10px;
    }
    .collection-item{
        position:relative;
        aspect-ratio:2/3;
        border-radius:11px;
        overflow:hidden;
        border:1px solid rgba(255,255,255,.16);
        background:rgba(255,255,255,.05);
    }
    .collection-item img{width:100%;height:100%;object-fit:cover;display:block;}
    .collection-item.locked{
        background:
            radial-gradient(circle at 30% 25%, rgba(255,255,255,.08), transparent 28%),
            radial-gradient(circle at 70% 75%, rgba(255,255,255,.05), transparent 30%),
            linear-gradient(145deg,#25202e,#0f0b15);
    }
    .collection-item.locked::before{
        content:"";
        position:absolute;
        inset:10px;
        border:1px solid rgba(255,255,255,.12);
        border-radius:9px;
    }
    .collection-item-label{
        position:absolute;
        left:6px; right:6px; bottom:6px;
        padding:5px 6px;
        border-radius:7px;
        background:rgba(0,0,0,.38);
        
        font-size:10px;
        font-weight:800;
        text-align:center;
    }
    .open-collection-btn{
        margin-top:13px;
        width:100%;
        height:42px;
        border-radius:12px;
        background:rgba(255,255,255,.08);
        border:1px solid rgba(255,255,255,.15);
        font-size:13px;
        font-weight:800;
    }

    @media (max-width:700px){
        .card-dock{ right:10px; width:38px; height:52px; }
        .card-peek{ display:none; }
        .card-panel{ padding:16px; border-radius:20px; }
        .collection-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
        .card-name{ font-size:21px; }
    }

</style>
</head>

<body>
<div class="station-wrap">
    <div class="study-bubble" id="studyBubble" aria-live="polite">Etüt bitimine --:--</div>
    <button class="station-btn" id="stationBtn">Not İstasyonuma Git</button>
</div>
<div class="warp" id="warp"></div>

<div class="timer-wrap">
    <div class="title">derssel şeyler</div>

    <div class="time" id="time">00:00</div>

    <div class="current">
        Current: <span id="current">00:00</span>
    </div>

    <div class="controls">
        <button class="start" id="startBtn">Start</button>

        <button class="lap" id="lapBtn">Lap</button>

        <button class="icon-btn" id="resetBtn" aria-label="Sıfırla">
            <svg class="reset-icon" viewBox="0 0 48 48" fill="none">
                <path d="M12 19a17 17 0 1 1-1 13" stroke="white" stroke-width="4" stroke-linecap="round"/>
                <path d="M12 10v10h10" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <button class="icon-btn" id="fullscreenBtn" aria-label="Tam ekran">
            <svg class="fullscreen-icon" viewBox="0 0 48 48" fill="none">
                <path d="M8 18V8h10M30 8h10v10M40 30v10H30M18 40H8V30"
                      stroke="white" stroke-width="4" stroke-linecap="square"/>
            </svg>
        </button>
    </div>
</div>


<script>
    let elapsed = 0;
    let currentElapsed = 0;
    let running = false;
    let lastTime = 0;
    let animationFrame = null;

    const timeEl = document.getElementById("time");
    const currentEl = document.getElementById("current");
    const startBtn = document.getElementById("startBtn");
    const lapBtn = document.getElementById("lapBtn");
    const resetBtn = document.getElementById("resetBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    function format(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        return String(minutes).padStart(2, "0") + ":" +
               String(seconds).padStart(2, "0");
    }

    function render() {
        timeEl.textContent = format(elapsed);
        currentEl.textContent = format(currentElapsed);
    }

    function tick(timestamp) {
        if (!running) return;

        if (!lastTime) lastTime = timestamp;
        const delta = timestamp - lastTime;
        elapsed += delta;
        currentElapsed += delta;
        lastTime = timestamp;

        render();
        animationFrame = requestAnimationFrame(tick);
    }

    startBtn.addEventListener("click", () => {
        running = !running;

        if (running) {
            startBtn.textContent = "Stop";
            lastTime = 0;
            animationFrame = requestAnimationFrame(tick);
        } else {
            startBtn.textContent = "Start";
            cancelAnimationFrame(animationFrame);
        }
    });

    lapBtn.addEventListener("click", () => {
        if (!running && currentElapsed === 0) return;
        currentElapsed = 0;
        currentEl.textContent = "00:00";
    });

    resetBtn.addEventListener("click", () => {
        running = false;
        cancelAnimationFrame(animationFrame);

        elapsed = 0;
        currentElapsed = 0;
        lastTime = 0;

        startBtn.textContent = "Start";

        render();
    });

    fullscreenBtn.addEventListener("click", async () => {
        try {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (e) {}
    });

    render();

    const stationBtn = document.getElementById("stationBtn");
    const warp = document.getElementById("warp");
    const studyBubble = document.getElementById("studyBubble");

    const studySchedules = {
        1: ["09:00-10:30","10:45-12:15","12:30-13:45","14:30-16:00","16:15-17:45","18:15-19:45","20:00-21:30"],
        2: ["09:00-10:30","10:45-12:15","12:30-13:45","14:30-16:00","16:15-17:45","18:15-19:45","20:00-21:30"],
        3: ["09:00-10:30","10:45-12:15","12:30-13:45","14:30-16:00","16:15-17:45","18:15-19:45","20:00-21:30"],
        4: ["09:00-10:30","10:45-12:15","12:30-13:45","14:30-16:00","16:15-17:45","18:15-19:45","20:00-21:30"],
        5: ["09:00-10:30","10:45-12:15","12:30-13:45","14:30-16:00","16:15-17:45","18:15-19:45","20:00-21:30"],
        6: ["10:15-13:15","14:15-15:45","16:00-17:30","17:45-19:30"]
    };

    function updateStudyBubble(){
        const now = new Date();
        const day = now.getDay();
        const schedule = studySchedules[day] || [];
        const nowMinutes = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
        let activeEnd = null;
        let activeName = null;
        let nextStart = null;

        for (let i=0;i<schedule.length;i++){
            const [start,end] = schedule[i].split('-').map(v=>{
                const [h,m] = v.split(':').map(Number);
                return h*60+m;
            });
            if (nowMinutes >= start && nowMinutes < end){
                activeEnd = end;
                activeName = day === 6 && i === 0 ? 'Deneme' : `${i+1}. Etüt`;
                break;
            }
            if (nowMinutes < start && nextStart === null) nextStart = start;
        }

        if (activeEnd !== null){
            let remaining = Math.max(0, Math.ceil((activeEnd-nowMinutes)*60));
            const mm = Math.floor(remaining/60);
            const ss = remaining % 60;
            studyBubble.textContent = `${activeName} · ${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
        } else {
            studyBubble.textContent = schedule.length ? 'Etüt dışında' : 'Bugün etüt yok';
        }
    }

    updateStudyBubble();
    setInterval(updateStudyBubble, 1000);

    stationBtn.addEventListener("click", () => {
        if (document.body.classList.contains("leaving")) return;

        document.body.classList.add("leaving");
        warp.classList.add("go");

        setTimeout(() => {
            window.location.href = "https://naxpages.github.io/notistasyonum/";
        }, 820);
    });
</script>

6HQbtu7nJOob7g4AIAEBwQIBAUGBQAmcFBjgocCggOAAhu5IG4enDI4cCAAAAAD1FE67lFFEh1l1DQTTITSMaO5CEPPEeDRNjrISWjw0WbRPxDRQ79Tqokqh9egLM7biOdoq/9k=',
    };

    const cards = [
        { id:'levi',   name:'Levi',   rarity:3, label:'Ultra Nadir',  image:CARD_IMAGES.levi },
        { id:'eren',   name:'Eren',   rarity:2, label:'Çok Nadir',    image:CARD_IMAGES.eren },
        { id:'erwin',  name:'Erwin',  rarity:1, label:'Nadir',        image:CARD_IMAGES.erwin },
        { id:'hange',  name:'Hange',  rarity:1, label:'Nadir',        image:CARD_IMAGES.hange },
        { id:'mikasa', name:'Mikasa', rarity:1, label:'Nadir',        image:CARD_IMAGES.mikasa }
    ];

    const cardDock = document.getElementById('cardDock');
    const cardPeekImg = document.getElementById('cardPeekImg');
    const cardModal = document.getElementById('cardModal');
    const cardClose = document.getElementById('cardClose');
    const collectCard = document.getElementById('collectCard');
    const collectImg = document.getElementById('collectImg');
    const cardName = document.getElementById('cardName');
    const cardRarity = document.getElementById('cardRarity');
    const cardPanelSub = document.getElementById('cardPanelSub');
    const collectionGrid = document.getElementById('collectionGrid');
    const collectionCount = document.getElementById('collectionCount');
    function setCardImage(img, card){
        if(!img || !card) return;
        img.src = card.image;
        img.alt = card.name;
        img.decoding = 'async';
    }


    const OWNED_KEY = 'aot_card_collection_v1';
    const OPENED_KEY = 'aot_daily_card_opened_v1';
    const DAILY_KEY = 'aot_daily_card_v1';

    function todayKey(){
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function readOwned(){
        try {
            const data = JSON.parse(localStorage.getItem(OWNED_KEY) || '[]');
            return Array.isArray(data) ? data.filter(id => cards.some(c => c.id === id)) : [];
        } catch { return []; }
    }

    function saveOwned(ids){
        localStorage.setItem(OWNED_KEY, JSON.stringify([...new Set(ids)]));
    }

    function dayNumber(key){
        const [y,m,d] = key.split('-').map(Number);
        return Math.floor(Date.UTC(y,m-1,d) / 86400000);
    }

    function chooseTodayCard(){
        const key = todayKey();
        const owned = readOwned();
        const start = ((dayNumber(key) % cards.length) + cards.length) % cards.length;
        for(let step=0; step<cards.length; step++){
            const c = cards[(start + step) % cards.length];
            if(!owned.includes(c.id)) return c;
        }
        return cards[start];
    }

    function getTodayCard(){
        const key = todayKey();
        const savedDate = localStorage.getItem(DAILY_KEY);
        const savedId = localStorage.getItem(DAILY_KEY + '_id');
        if(savedDate === key && cards.some(c => c.id === savedId)){
            return cards.find(c => c.id === savedId);
        }
        const picked = chooseTodayCard();
        localStorage.setItem(DAILY_KEY, key);
        localStorage.setItem(DAILY_KEY + '_id', picked.id);
        return picked;
    }

    function hasOpenedToday(){
        return localStorage.getItem(OPENED_KEY) === todayKey();
    }

    function updatePeek(){
        const today = getTodayCard();
        setCardImage(cardPeekImg, today);
        cardDock.classList.toggle('has-new', !hasOpenedToday());
    }

    function renderCollection(){
        const owned = readOwned();
        collectionCount.textContent = `${owned.length} / ${cards.length}`;
        const fragment = document.createDocumentFragment();

        cards.forEach(card => {
            const item = document.createElement('div');
            const isOwned = owned.includes(card.id);
            item.className = `collection-item${isOwned ? '' : ' locked'}`;

            if (isOwned) {
                const img = document.createElement('img');
                img.src = card.image;
                img.alt = card.name;
                img.loading = 'lazy';
                img.decoding = 'async';
                item.appendChild(img);

                const label = document.createElement('div');
                label.className = 'collection-item-label';
                label.textContent = card.name;
                item.appendChild(label);
            }

            fragment.appendChild(item);
        });

        collectionGrid.replaceChildren(fragment);
    }

    function openDailyCard(){
        const card = getTodayCard();
        collectCard.classList.remove('flipped');
        setCardImage(collectImg, card);
        cardName.textContent = card.name;
        cardRarity.textContent = card.label;
        cardMetaClass(card.rarity);

        const opened = hasOpenedToday();
        cardPanelSub.textContent = '';
        renderCollection();
        cardModal.classList.add('open');
        cardModal.setAttribute('aria-hidden','false');

        if(!opened){
            setTimeout(() => {
                collectCard.classList.add('flipped');
                const owned = readOwned();
                if(!owned.includes(card.id)) saveOwned([...owned, card.id]);
                localStorage.setItem(OPENED_KEY, todayKey());
                cardPanelSub.textContent = '';
                renderCollection();
                updatePeek();
            }, 260);
        } else {
            setTimeout(() => collectCard.classList.add('flipped'), 120);
        }
    }

    function cardMetaClass(rarity){
        const meta = document.getElementById('cardMeta');
        meta.className = `card-meta rarity-${rarity}`;
    }

    function closeCard(){
        cardModal.classList.remove('open');
        cardModal.setAttribute('aria-hidden','true');
    }

    cardDock.addEventListener('click', openDailyCard);
    cardClose.addEventListener('click', closeCard);
    cardModal.addEventListener('click', e => { if(e.target === cardModal) closeCard(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeCard(); });


    updatePeek();
    renderCollection();
})();
</script>

</html>
